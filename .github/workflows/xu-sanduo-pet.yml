name: Build Xu Sanduo Pet

on:
  push:
    paths:
      - "xu-sanduo-pet/**"
      - ".github/workflows/xu-sanduo-pet.yml"
  pull_request:
    paths:
      - "xu-sanduo-pet/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: xu-sanduo-pet-mac
          - os: windows-latest
            script: dist:win
            artifact: xu-sanduo-pet-win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: xu-sanduo-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: xu-sanduo-pet/package-lock.json
      - run: npm ci
      - run: npm run test:states
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            xu-sanduo-pet/release/*.*
            xu-sanduo-pet/release/*/*
          if-no-files-found: warn
          retention-days: 14
